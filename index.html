<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suntik Dana</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@600;700&display=swap" rel="stylesheet">
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

html, body{
    height:auto;
    min-height:100%;
}

body{
    background:url("bg/gambar1.jpg") center/cover no-repeat;
    color:#fff;
    overflow-x:hidden;
	overflow-y:auto;
	display:block;
	min-height:100vh;
	padding:40px 20px;
}

body::after{
    content:"";
    display:block;
    height:120px;
}


.container{
    width:100%;
    max-width:900px;
    margin:0 auto;
    min-height:0;
    padding-bottom:300px;
	min-height:calc(100vh + 200px);
}


.title{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
	font-family:'Orbitron',sans-serif;
    font-size:34px;
    font-weight:800;
    color:#ffffff;
    letter-spacing:2px;
    text-align:center;
    margin-bottom:2px;
    font-family:'Orbitron',sans-serif;

    text-shadow:
        0 0 10px rgba(59,130,246,0.25);
}

.title-logo{
    width:55px;
    height:55px;
}


.box{

    background:rgba(12,18,32,.80);

    backdrop-filter:blur(14px);

    border:1px solid rgba(96,165,250,.25);

    border-radius:18px;

    padding:14px;

    margin-bottom:14px;

    box-shadow:

    0 4px 25px rgba(0,0,0,.35);

}

.input-box{
    margin-top:18px;
}

textarea{

width:100%;

background:#081220;

color:white;

padding:14px;

border-radius:14px;

border:1px solid rgba(96,165,250,.2);

outline:none;

font-size:14px;

line-height:1.5;

resize:none;

text-align:center;

}

.settings input,
.settings select{

background:#081220;

color:white;

font-size:14px;

font-weight:600;

border:1px solid rgba(96,165,250,.25);

transition:.3s;

}


.settings input:focus,
.settings select:focus{

border-color:#38bdf8;

box-shadow:

0 0 10px rgba(56,189,248,.4);

}

#input{
    height:160px;
}

#input2{
    margin:0;
    padding:4px 8px;

    font-size:14px;      
    font-weight:normal;  
    line-height:1.3;

    color:#fff;
    text-align:center;

    white-space:pre-wrap;
    word-break:break-word;

    display:inline-block;
    width:100%;
}

.settings{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.settings input,
.settings select{
    flex:1;
    min-width:150px;
    padding:10px;
    border-radius:10px;
    border:1px solid #2b5cff;
    background:linear-gradient(135deg,#ffffff 0%,#f8f8f8 35%,#e9e9e9 70%,#ffffff 100%);
    color:black;
    text-align:center;
    font-weight:bold;
}


button{
    width:100%;
    padding:12px;
    margin-top:1px;
	margin-bottom:10px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#2563eb,#38bdf8);
    color:#fff;
    font-weight:bold;
    cursor:pointer;
    position:relative;
    overflow:hidden;
}

button::before{
    content:"";
    position:absolute;
    top:0;
    left:-120%;
    width:40%;
    height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,0.4),transparent);
    transform:skewX(-25deg);
    animation:shineMove 2.5s linear infinite;
}


@keyframes shineMove{
    0%{ left:-120%; }
    100%{ left:150%; }
}


table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
	font-size:14px;
}

th,td{
    border:1px solid #2b5cff;
    padding:8px;
    text-align:center;
}

td{
    background:#0b1220;
}

th{
    background:linear-gradient(135deg,#ffffff 0%,#f8f8f8 35%,#e9e9e9 70%,#ffffff 100%);
    color:#111;
}


.footer-brand{
    margin-top:14px;

    display:block;
    width:fit-content;

    margin-left:auto;
    margin-right:auto;

    font-size:9px;

    font-weight:600;
    letter-spacing:0.6px;

    color:rgba(255,255,255,0.9);

    padding:2px 6px;   

    border-radius:6px;

    border:1px solid rgba(96,165,250,0.25);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    box-shadow:0 6px 18px rgba(0,0,0,0.2);
	text-shadow:
    0 1px 2px rgba(0,0,0,0.8),
    0 0 8px rgba(255,255,255,0.15);
}

.output-title{
    text-align:center;

    font-size:13px;
    font-weight:700;

    letter-spacing:1px;

    color:#60a5fa;

    margin-bottom:10px;

    text-transform:uppercase;

    text-shadow:
        0 0 10px rgba(96,165,250,.35);
}

</style>
</head>

<body>

<div class="container">

<div class="title">
	<img src="bg/gambar4.png" alt="Logo" class="title-logo">
        SUNTIK DANA
    </div>
	<div class="title-line"></div>

<div class="box input-box">
    <textarea id="input" placeholder="Masukkan Data. . ."></textarea>
</div>

<div class="box" id="excelBox" style="display:none;">

    <div class="output-title">
        CATAT KE EXCEL
    </div>

    <pre id="input2"></pre>

</div>



<button onclick="generate()">GENERATE</button>
<button id="copyBtn" onclick="copyData()">COPY DATA</button>

<div class="box settings">
    <input id="globalNama" placeholder="NAMA">

    <select id="globalBank">
        <option value="">BANK</option>
        <option>BCA</option>
        <option>BRI</option>
        <option>BNI</option>
        <option>MANDIRI</option>
    </select>

    <select id="globalAdm">
    <option value="0">TANPA ADM</option>
    <option value="2500">2.500</option>
    <option value="6500">6.500</option>
</select>
</div>

<div class="box" id="tableBox" style="display:none;">

<table>

<thead>
<tr>
    <th>BANK</th>
    <th>NAMA PENGIRIM</th>
    <th>TUJUAN</th>
    <th>ADM</th>
    <th>NOMINAL</th>
</tr>
</thead>

<tbody id="list"></tbody>

</table>

</div>

<div class="footer-brand">
    © 2026 | BY YOGIK
</div>

</div>

<script>
let GLOBAL_HEADER = "SUNTIK DANA";

function generate(){

    const raw = document.getElementById("input").value;
    const lines = raw.split("\n").map(v => v.replace(/\r/g,""));

    const gNama = document.getElementById("globalNama").value.toUpperCase();
    const gBank = document.getElementById("globalBank").value;
    const gAdm = parseInt(document.getElementById("globalAdm").value) || 0;

    const tbody = document.getElementById("list");
    tbody.innerHTML = "";
	
	document.getElementById("excelBox").style.display = "none";
document.getElementById("tableBox").style.display = "none";

let jumlahData = 0;

    GLOBAL_HEADER = (lines[0] || "").trim() || "SUNTIK DANA";

    for(let i=1;i<lines.length;i++){

        const baris1 = lines[i];
        const baris2 = lines[i+1];
        const baris3 = lines[i+2];

        if(!baris1 || !baris2 || !baris3) continue;

        const isRek = /^[0-9]+$/.test(baris2);
        const isNom = /[0-9]/.test(baris3);

        if(!isRek || !isNom) continue;

        const tujuan = baris1;
        const angka = parseInt(baris3.replace(/[^\d]/g,"")) || 0;
        const total = angka + gAdm;
		
		jumlahData++;
        tbody.innerHTML += `
<tr>
<td>
<select class="bank-row">
<option ${gBank==="BCA"?"selected":""}>BCA</option>
<option ${gBank==="BRI"?"selected":""}>BRI</option>
<option ${gBank==="BNI"?"selected":""}>BNI</option>
<option ${gBank==="MANDIRI"?"selected":""}>MANDIRI</option>
</select>
</td>

<td contenteditable="true">${gNama}</td>
<td>${tujuan}</td>

<td>
<select class="adm-row">
    <option value="0" ${gAdm==0?"selected":""}>-</option>
    <option value="2500" ${gAdm==2500?"selected":""}>2500</option>
    <option value="6500" ${gAdm==6500?"selected":""}>6500</option>
</select>
</td>

<td class="nominal-cell" data-asli="${angka}">
${total.toLocaleString('id-ID')}
</td>

</tr>`;
         i += 2;
    }

    if(jumlahData > 0){

    document.getElementById("excelBox").style.display = "block";
    document.getElementById("tableBox").style.display = "block";

    updateOutput2();
}
}

function copyData(){

    const rows = document.querySelectorAll("#list tr");

    let hasil = GLOBAL_HEADER + "\n\n";

    rows.forEach(row => {

        const c = row.querySelectorAll("td");

        const bank = c[0].querySelector(".bank-row").value;
        const nama = c[1].innerText.trim();
        const tujuan = c[2].innerText.trim();
        const nominal = c[4].innerText.replace(/[^\d]/g,"");

        hasil += `${bank} ${nama} KE ${tujuan}\n${parseInt(nominal).toLocaleString('id-ID')}\n\n`;
    });

    navigator.clipboard.writeText(hasil);

    const btn = document.getElementById("copyBtn");
    btn.innerText = "✓ TERCOPY";

    setTimeout(()=>{
        btn.innerText = "COPY DATA";
    },2000);
}

function updateOutput2(){

    const rows = document.querySelectorAll("#list tr");

    let hasil2 = "";

    rows.forEach(row => {

        const c = row.querySelectorAll("td");

        const bank = c[0].querySelector(".bank-row").value;
        const nama = c[1].innerText.trim();
        const nominal = c[4].dataset.asli;

        hasil2 += `${GLOBAL_HEADER} DARI TAMPUNGAN / ${bank} ${nama}\n${parseInt(nominal)}\n`;
    });

    document.getElementById("input2").textContent = hasil2;
}

document.addEventListener("change", function(e){

    if(e.target.classList.contains("adm-row")){

        const row = e.target.closest("tr");

        const nominalCell = row.querySelector(".nominal-cell");
        const nominalAsli = parseInt(nominalCell.dataset.asli) || 0;
        const adm = parseInt(e.target.value) || 0;

        const total = nominalAsli + adm;

        nominalCell.innerText = total.toLocaleString('id-ID');
    }
});

document.addEventListener("input", function(e){

    const td = e.target.closest("td");

    // hanya target kolom nama (contenteditable)
    if(td && td.isContentEditable){

        updateOutput2();
    }
});

</script>

</body>
</html>
